name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build static export
        env:
          # Repo-name prefix for Pages. Set to "" if you move to a custom domain.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Client-side calls to the agent backend. Unset means the UI renders
          # but those requests fail — expected for a static demo deploy.
          NEXT_PUBLIC_AGENT_API: ${{ vars.NEXT_PUBLIC_AGENT_API }}
          NEXT_PUBLIC_SCAN_STREAM_URL: ${{ vars.NEXT_PUBLIC_SCAN_STREAM_URL }}
        run: npm run build

      - name: Disable Jekyll processing of _next/
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
